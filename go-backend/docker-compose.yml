services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: escrow
      POSTGRES_PASSWORD: escrow
      POSTGRES_DB: escrow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # runs once, on first start of an empty volume
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  pgdata:
