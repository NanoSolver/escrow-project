services:
  - type: web
    name: trustforge-sepolia-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: EXPECTED_CHAIN_ID
        value: "11155111"
      - key: RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: AI_URL
        value: http://127.0.0.1:8001/evaluate
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: openrouter/free
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: SAMBANOVA_BASE_URL
        value: https://api.sambanova.ai/v1
      - key: SAMBANOVA_MODEL
        value: Meta-Llama-3.3-70B-Instruct
      - key: NVIDIA_NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_NIM_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: DATABASE_URL
        sync: false
      - key: ORACLE_PRIVATE_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SAMBANOVA_API_KEY
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
